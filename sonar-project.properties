# Análisis de SonarQube Cloud en el canal de integración continua (EN-08, design D9).
# Solo identificadores públicos: el token vive en los secretos de GitHub (SONAR_TOKEN).

sonar.organization=jmartinez278
sonar.projectKey=jmartinez278_CarpetaDocente

# Código propio (src/ y scripts/) y pruebas. Las migraciones generadas, el CSS compilado y node_modules no cuentan.
sonar.sources=src,scripts
sonar.tests=src/backend,scripts
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/migrations/**,**/tests/**,**/static/dist/**,**/node_modules/**

sonar.python.version=3.13
# Informe del trabajo "Pruebas y cobertura" (rutas relativas: relative_files en pyproject.toml).
sonar.python.coverage.reportPaths=coverage.xml
