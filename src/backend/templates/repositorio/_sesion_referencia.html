{% comment %}
Tarjeta café «Material de referencia» (US-018, D6): la fuente y el permiso de uso, sin acciones. La incluye la página de la docente (``lateral``).
{% endcomment %}
<aside class="sesion-tuya" aria-labelledby="material-referencia">
  <h2 id="material-referencia">Material de referencia</h2>
  <dl class="sesion-referencia">
    <div><dt class="small">Fuente</dt><dd>{{ sesion.fuente }}</dd></div>
    <div><dt class="small">Permiso de uso</dt><dd>{{ sesion.permiso_uso }}</dd></div>
  </dl>
</aside>
