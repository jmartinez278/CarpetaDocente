{% comment %}Miniatura esquemática de Sesiones (DESIGN.md): barras en lugar de títulos y los archivos Word y PDF.{% endcomment %}
<div class="ficha ficha--sesiones" aria-hidden="true">
  <div class="ficha__sesion">
    <span class="ficha__barra ficha__barra--1 ficha__barra--titulo"></span>
    <span class="ficha__barra ficha__barra--5"></span>
    <div class="ficha__archivos"><span class="ficha__archivo">{% include "iconos/file-text.svg" %}Word</span><span class="ficha__archivo">{% include "iconos/file-text.svg" %}PDF</span></div>
  </div>
  <div class="ficha__sesion">
    <span class="ficha__barra ficha__barra--3 ficha__barra--titulo"></span>
    <span class="ficha__barra ficha__barra--5"></span>
    <div class="ficha__archivos"><span class="ficha__archivo">{% include "iconos/file-text.svg" %}Word</span></div>
  </div>
</div>
