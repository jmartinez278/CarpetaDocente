[project]
name = "carpetadocente"
version = "0.1.0"
description = "Sistema web para la gestión y planificación pedagógica en educación primaria – I.E. Virgen del Carmen, Huayucachi"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[tool.uv]
package = false

[tool.vercel]
# Vercel carga la aplicación WSGI desde la raíz (EN-02, D6)
entrypoint = "src.backend.config.wsgi:application"

[tool.vercel.scripts]
build = "python scripts/build_vercel.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src/backend", "scripts"]
testpaths = ["src/backend", "scripts"]
python_files = ["test_*.py"]
# Las pruebas de punta a punta necesitan Chromium y el CSS compilado: se piden con
# `pytest -m e2e` (el último -m manda) y el `pytest` de siempre no las ejecuta.
markers = ["e2e: prueba de punta a punta en el navegador con Playwright (EN-08)"]
addopts = ["-m", "not e2e"]

[tool.ruff]
target-version = "py313"
line-length = 100
# Las apps viven en src/backend y los scripts en scripts/: así Ruff los reconoce como código propio
src = ["src/backend", "scripts"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/W: pycodestyle · F: Pyflakes · I: isort · B: bugbear · UP: pyupgrade
# DJ: flake8-django · S: reglas de seguridad derivadas de Bandit
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# Los scripts de verificación llaman a git, uv y gh con argumentos fijos, sin shell.
"scripts/**" = ["S603", "S607"]

[tool.coverage.run]
# Código propio de src/backend y scripts/; no cuentan las migraciones generadas ni las pruebas.
source = ["src/backend", "scripts"]
omit = ["*/migrations/*", "*/tests/*"]
# Rutas relativas en coverage.xml: SonarQube Cloud no encuentra las rutas absolutas del ejecutor.
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# DoD 1: el mismo umbral en la laptop y en el canal (EN-08).
fail_under = 80
